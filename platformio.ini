; ================================================================
;  PescaPlus — Modulo Barco — ESP32 DevKit Classic (ESP-IDF)
;  Compilar : pio run -e esp32
;  Gravar   : pio run -e esp32 -t upload   (bootloader + particoes + app)
;  Monitor  : pio device monitor -e esp32
;
;  O firmware.bin gerado e ASSINADO (ECDSA) por scripts/sign_firmware.py.
;  A chave privada pescaplus_signing_key.pem precisa existir na raiz do
;  projeto (nunca commitada). Ver docs/FIRMWARE.md.
; ================================================================

[env:esp32]
platform          = espressif32 @ 8.0.0
platform_packages =
    platformio/framework-espidf @ 4.50505.0
    platformio/toolchain-xtensa-esp-elf @ 14.2.0+20260121
framework         = espidf
board             = esp32dev
board_build.partitions = partitions.csv
board_build.flash_size = 4MB
monitor_speed     = 115200
monitor_filters   = esp32_exception_decoder
monitor_rts       = 0
monitor_dtr       = 0
upload_port       = /dev/cu.usbserial-0001
upload_protocol   = esptool
extra_scripts     = pre:scripts/sign_firmware.py
